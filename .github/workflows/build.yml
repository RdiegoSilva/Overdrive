name: Build reisbot.elf

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: make -j"$(nproc)"

      - name: Publicar o ELF
        uses: actions/upload-artifact@v4
        with:
          name: reisbot-elf
          path: reisbot.elf
